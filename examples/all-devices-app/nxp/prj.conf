# This file sets the base configuration for the NXP All-Devices App.
# Use CONF_FILE_NAME to overlay a platform-specific config from
# examples/platform/nxp/config/ (e.g. prj_wifi.conf, prj_thread_ftd.conf).

CONFIG_CHIP=y
CONFIG_BT_DEVICE_NAME="\"NXPAllDevicesApp\""
CONFIG_CHIP_DEVICE_PRODUCT_NAME="All Devices App"

# Enable Matter CLI shell for "devtype set <device-type>" command
CONFIG_CHIP_LIB_SHELL=y
CONFIG_CHIP_APP_CLI=y

# Use code-driven data model: no CONFIG_CHIP_APP_CLUSTERS
# (AppTaskBase::InitServer is gated by CONFIG_NXP_ALL_DEVICES_APP to call
#  InitAllDevicesServer instead of the default CodegenDataModelProvider path)
CONFIG_NXP_ALL_DEVICES_APP=y

# SDK configs
CONFIG_MCUX_PRJSEG_module.board.boardfile=n

CONFIG_configTOTAL_HEAP_SIZE=256000

# Disable Identify cluster codegen registration - all-devices app uses
# code-driven data model (CodeDrivenDataModelProvider), not codegen
# (CodegenDataModelProvider). The codegen-path registration in
# AppTaskBase::Init would fail and crash the app before the CLI starts.
CONFIG_CHIP_APP_IDENTIFY=n

